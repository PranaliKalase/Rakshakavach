[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raksha-kavach-backend"
version = "1.0.0"
description = "RAKSHKAVACH Backend API & Machine Learning Risk Engine"
authors = [{ name = "RAKSHKAVACH Team" }]
dependencies = [
    "httpx>=0.28.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0"
]
